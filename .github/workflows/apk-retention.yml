name: Group Shizuku stable and experimental downloads
on:
  workflow_run:
    workflows: [Build APK]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: shizuku-downloads-${{ github.repository }}
  cancel-in-progress: false
jobs:
  downloads:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate Shizuku-only download selection
        run: python3 .github/scripts/group-shizuku-downloads.py --self-test
      - name: Publish one signed Shizuku APK per channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/group-shizuku-downloads.py
