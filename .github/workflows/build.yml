name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.1; blank increments previous tag."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP: McpAdbAndroidLogger

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test MCP gateway
        run: |
          python -m pip install -r gateway/requirements.txt
          python -m pytest -q gateway/tests

      - name: Configure version and release notes
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*' | sed -nE 's/^v([0-9]+[.][0-9])$/\1/p' | sort -V | tail -1 || true)
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+[.][0-9]$' || exit 1
            version="$REQUESTED"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="${latest:-1.0}"
          elif [ -z "$latest" ]; then
            version="1.0"
          else
            number=$(( ${latest%.*} * 10 + ${latest#*.} + 1 ))
            version="$((number / 10)).$((number % 10))"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          suffix=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then suffix="-experimental.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION_SUFFIX=$suffix" >> "$GITHUB_ENV"
          {
            echo "## $APP $version"
            echo
            echo "### What's new"
            git log -20 --no-merges --pretty='- %s'
            echo
            echo "### Install"
            echo "Install the signed APK from this release. Android will verify its signer."
          } > release-notes.md

      - name: Install SDK 37.2 and build Android debug
        env:
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2"
          chmod +x gradlew
          ./gradlew --no-daemon :app:verifySharedLibraries :app:testDebugUnitTest :app:lintDebug :app:assembleDebug             -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build and sign release-compatible APK
        id: signing
        env:
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN || github.token }}
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ] || [ -z "$STORE_PASSWORD" ] ||
             [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning::Signing secrets missing. Uploading debug artifact only, no updateable release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./gradlew --no-daemon :app:assembleRelease             -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore"             --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS"             --key-pass env:KEY_PASSWORD             --out "$APP-$VERSION.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --print-certs "$APP-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-signed-${{ github.run_number }}
          path: ${{ env.APP }}-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Publish stable or PR experimental release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            tag="experimental-pr-$PR_NUMBER-run-$GITHUB_RUN_NUMBER"
            title="$APP experimental · PR #$PR_NUMBER · run $GITHUB_RUN_NUMBER"
            target="$PR_HEAD_SHA"
            extra=(--prerelease --latest=false)
          else
            tag="v$VERSION"
            title="$APP $VERSION"
            target="$GITHUB_SHA"
            extra=(--latest)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              gh release upload "$tag" "$APP-$VERSION.apk" --clobber
            else
              echo "::error::Stable release tag already exists"
              exit 1
            fi
          else
            gh release create "$tag" "$APP-$VERSION.apk" --target "$target"               --title "$title" --notes-file release-notes.md "${extra[@]}"
          fi

      - name: Check distribution configuration
        if: steps.signing.outputs.signed == 'true'
        env:
          DIST_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
        run: |
          if [ -n "$DIST_TOKEN" ]; then
            echo "HAS_DISTRIBUTION=true" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_DISTRIBUTION_TOKEN not set: no public update channel"
          fi

      - name: Publish public update channel
        if: steps.signing.outputs.signed == 'true' && env.HAS_DISTRIBUTION == 'true'
        env:
          ANDROID_DISTRIBUTION_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
          GH_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/publish-distribution.sh
