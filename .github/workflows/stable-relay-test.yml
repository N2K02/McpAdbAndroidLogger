name: Stable MCP relay tests

on:
  pull_request:
    paths:
      - 'stable-relay/**'
      - '.github/workflows/stable-relay-test.yml'
  push:
    branches:
      - 'experimental/full-android-mcp-logger'
    paths:
      - 'stable-relay/**'
      - '.github/workflows/stable-relay-test.yml'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker routing and access control
        run: node --test stable-relay/worker.test.mjs
