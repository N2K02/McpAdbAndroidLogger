version: 2
registries:
  n2k02-theme:
    type: maven-repository
    url: https://maven.pkg.github.com/N2K02/n2k02theme
    username: N2K02
    password: ${{secrets.N2K02_PACKAGES_TOKEN}}
  n2k02-updater:
    type: maven-repository
    url: https://maven.pkg.github.com/N2K02/n2k02updater
    username: N2K02
    password: ${{secrets.N2K02_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: gradle
    directory: "/"
    registries:
      - n2k02-theme
      - n2k02-updater
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: pip
    directory: "/gateway"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
