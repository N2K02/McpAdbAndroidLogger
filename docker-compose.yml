services:
  mcp-android-logger:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEVICE_API_KEY: "${DEVICE_API_KEY:?Set a long random device key}"
      MCP_CLIENT_TOKEN: "${MCP_CLIENT_TOKEN:?Set a separate long MCP client token}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
